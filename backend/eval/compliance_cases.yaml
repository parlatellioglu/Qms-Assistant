      0.9 | 05/03/2025 | Ekip | Ekip | İç gözden geçirme.
      1.0 | 10/03/2025 | Ekip | Ekip | Onaylandı (baseline).
      1.0 Introduction
      Purpose | Bu belge sistem gereksinimlerini tanımlar.
      Scope
      Sistem mobil self-servis işlemlerini kapsar. Web self-servis portalı ve
      kurumsal (B2B) abonelik yönetimi bu belgenin kapsamı DIŞINDADIR.
      Functional Requirements
      FR-01 | Giriş | Kullanıcı güvenli oturum açar.
      FR-02 | Ödeme | Kullanıcı fatura öder.
      FR-03 | Paket | Kullanıcı paket değiştirir.
      Performance Requirements
      Sistem saniyede en az 500 işlemi (500 TPS) sürdürür, en fazla 2 saniye
      yanıt süresiyle ve aynı anda 50.000 kullanıcıyı destekler.
      Security Requirements
      Erişim, jeton tabanlı oturum ile doğrulanır ve rollere göre kısıtlanır.
      Veriler beklerken ve iletilirken uçtan uca şifrelenir (TLS ve depoda
      AES-256). Tüm finansal işlemler için değiştirilemez bir iz kaydı tutulur.
      Service Management Requirements
      Hizmet, yılın %99,9 oranında erişilebilir olmalıdır. Felaket durumunda en
      fazla 15 dakikalık veri kaybı (RPO) ve 2 saatlik kurtarma süresi (RTO)
      hedeflenir.
      Error Messages and Exception Handling
      Hatalı işlemlerde sistem işlemi güvenli biçimde reddeder, değişiklikleri
      geri alır (rollback) ve kullanıcıyı anlaşılır bir mesajla bilgilendirir.
      7.0 References
      BUR – Business User Requirements (CMMI-IT-004), v1.0
      TRF – Technical Requirements Form (CMMI-IT-001), v1.0
