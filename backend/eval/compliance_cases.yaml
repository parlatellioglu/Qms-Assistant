# Compliance Checker evaluation set — the "answer key".
#
# Each case pairs a DOCUMENT with the EXPECTED per-rule verdict (pass | fail).
# The harness (scripts/query/eval_compliance.py) runs the checker over every case
# and compares actual vs. expected to compute a per-rule / per-tier confusion
# matrix (true/false positives & negatives, precision, recall). This is what
# it means to "tune prompts and thresholds against the eval set":
# change a rule or the judge prompt, re-run, and see whether FP/FN went down.
#
# A document is given by `doc_ref` (id of a checkable corpus/draft document) OR
# `doc_inline` (a full document dict, for surgical variants we don't want in the
# UI corpus). `expected` maps rule id -> the verdict a correct checker produces.
#
# `expected` is the GROUND TRUTH regardless of tier. The deterministic tiers
# (structure/traceability) are graded on every run. The content tier
# (llm_judge) only grades when the harness runs with --content (needs Ollama);
# without it those rules report `skipped` and are counted as "ungraded", not as
# errors. Include compliant docs (real SRS + a reworded variant) so we measure
# false POSITIVES, not just recall on broken drafts.

# --------------------------------------------------------------------------- #
#  Compliant baselines — nothing should be flagged (false-positive guards).
# --------------------------------------------------------------------------- #
- name: real-srs-baseline
  doc_ref: CMMI-IT-005
  note: >
    The approved baseline SRS (v1.0). Every rule must pass; any failure here is a
    false positive.
  expected:
    RULE-SRS-STRUCT-001: pass
    RULE-SRS-STRUCT-002: pass
    RULE-SRS-STRUCT-003: pass
    RULE-SRS-STRUCT-004: pass
    RULE-SRS-STRUCT-006: pass
    RULE-SRS-STRUCT-007: pass
    RULE-SRS-META-005: pass
    RULE-SRS-TRACE-010: pass
    RULE-SRS-TRACE-011: pass
    RULE-SRS-CONTENT-020: pass
    RULE-SRS-CONTENT-021: pass
    RULE-SRS-CONTENT-022: pass
    RULE-SRS-CONTENT-023: pass
    RULE-SRS-CONTENT-024: pass

- name: reworded-compliant-srs
  note: >
    A fully compliant SRS whose content is PARAPHRASED (different wording from the
    baseline). Guards content-tier false positives: the judge must still pass
    security/performance/continuity even when they aren't phrased like the source.
  doc_inline:
    id: EVAL-SRS-REWORDED
    doc_kind: SRS
