<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QMS Assistant</title>
<link rel="stylesheet" href="styles.css" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: var(--font-sans); background: var(--surface-page); color: var(--text-body); }
  #root { height: 100vh; }
  @keyframes qmsBlink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
  .qms-cursor { animation: qmsBlink 1s step-start infinite; color: var(--blue-400); margin-left: 1px; font-weight: 600; }
  /* Sidebar history rows: reveal the delete control only on hover. */
  .qms-conv-del { opacity: 0; transition: opacity var(--dur-fast, 120ms) ease; }
  .qms-conv-row:hover .qms-conv-del { opacity: 1; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<script src="app/config.js"></script>
<script src="app/history.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="app/Sidebar.jsx"></script>
<script type="text/babel" src="app/EmptyState.jsx"></script>
<script type="text/babel" src="app/ChatThread.jsx"></script>
<script type="text/babel" src="app/RulesManager.jsx"></script>
<script type="text/babel" src="app/ComplianceChecker.jsx"></script>
<script type="text/babel" src="app/ProjectStart.jsx"></script>
<script type="text/babel" src="app/App.jsx"></script>
<script type="text/babel" data-presets="react">
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
